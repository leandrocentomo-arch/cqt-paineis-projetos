<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel de Atividades LRC · CQT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --tinta:#14304C; --meio:#315275; --oficial:#336699; --papel:#F7FAFE; --creme:#FAF9F5; --fio:#A3B5C8; --erro:#EF4545; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--creme); color: var(--tinta);
    font-family: 'IBM Plex Sans Condensed', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 380px; margin: 14vh auto 0; padding: 0 20px; }
  .caixa { background: #fff; border: 1px solid rgba(20,48,76,.16); border-radius: 3px; padding: 28px 26px 26px; }
  .sobre { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--oficial); margin: 0 0 10px; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -.012em; line-height: 1.15; margin: 0 0 22px; }
  label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--meio); margin: 0 0 6px; }
  input { width: 100%; height: 38px; padding: 0 12px; font: 15px 'IBM Plex Mono', monospace; color: var(--tinta);
    background: var(--papel); border: 1px solid var(--fio); border-radius: 3px; outline: none; }
  input:focus { border-color: var(--oficial); }
  button { margin-top: 14px; width: 100%; height: 38px; border: 1px solid var(--tinta); border-radius: 3px; background: var(--tinta); color: var(--papel);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 18px; margin: 12px 0 0; font-size: 13px; color: var(--erro); }
</style>
</head>
<body>
<main>
  <div class="caixa">
    <p class="sobre">CQT</p>
    <h1>Painel de Atividades LRC</h1>
    <form id="f" autocomplete="off">
      <label for="s">Senha</label>
      <input id="s" type="password" autofocus>
      <button id="b" type="submit">Abrir</button>
      <p class="msg" id="m"></p>
    </form>
  </div>
</main>
